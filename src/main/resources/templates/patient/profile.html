<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MediConnect | My Profile</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Inter", -apple-system, Arial, sans-serif;
            background: #f6f8fb;
            color: #0f172a;
            -webkit-font-smoothing: antialiased;
        }

        .page {
            min-height: 100vh;
        }

        .topbar {
            height: 82px;
            background: rgba(255, 255, 255, .85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #edf0f3;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 42px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            border-radius: 13px;
            background: linear-gradient(135deg, #0f766e, #14b8a6);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 8px 18px rgba(15, 118, 110, .28);
        }

        .brand h2 {
            color: #115e59;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -.3px;
        }

        .brand p {
            color: #9ca3af;
            font-size: 14.5px;
            margin-top: 2px;
        }

        .back-button {
            border: 1.5px solid #e5e7eb;
            background: white;
            border-radius: 10px;
            padding: 10px 18px;
            cursor: pointer;
            font-weight: 700;
            font-size: 15px;
            color: #374151;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: .18s ease;
        }

        .back-button:hover {
            background: #0f766e;
            border-color: #0f766e;
            color: #fff;
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(15, 118, 110, .22);
        }

        .container {
            max-width: 1100px;
            margin: 45px auto;
            padding: 0 25px;
            animation: fadeInUp .35s ease both;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .page-heading {
            margin-bottom: 26px;
        }

        .page-heading h1 {
            font-size: 29px;
            font-weight: 800;
            letter-spacing: -.5px;
            margin-bottom: 7px;
        }

        .page-heading p {
            color: #7b8493;
            font-size: 15.5px;
        }

        .profile-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 25px;
            align-items: start;
        }

        .card {
            background: white;
            border: 1px solid #edf0f3;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, .05);
        }

        .profile-summary {
            text-align: center;
        }

        .large-avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            margin: 0 auto 18px;
            background: linear-gradient(135deg, #0f766e, #14b8a6);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: 800;
            box-shadow: 0 12px 26px rgba(15, 118, 110, .28);
        }

        .profile-summary h2 {
            font-size: 21px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .profile-summary .email {
            color: #7b8493;
            font-size: 15.5px;
            word-break: break-word;
        }

        .role-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 18px;
            padding: 8px 16px;
            border-radius: 30px;
            background: #e7f8f4;
            color: #0f766e;
            font-size: 14.5px;
            font-weight: 800;
            letter-spacing: .2px;
        }

        .information-card h2 {
            font-size: 19px;
            font-weight: 800;
            margin-bottom: 7px;
        }

        .information-card > p {
            color: #8a929f;
            font-size: 15px;
            margin-bottom: 22px;
        }

        .info-row {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 17px 4px;
            border-bottom: 1px solid #edf0f3;
            border-radius: 10px;
            transition: background .15s ease;
        }

        .info-row:hover {
            background: #fafcfe;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-icon {
            min-width: 44px;
            height: 44px;
            border-radius: 12px;
            background: #eefaf8;
            color: #0f766e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .info-content {
            flex: 1;
        }

        .info-content span {
            display: block;
            color: #8a929f;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .3px;
            margin-bottom: 5px;
        }

        .info-content strong {
            font-size: 15px;
            font-weight: 700;
        }

        .signout-button {
            width: 100%;
            margin-top: 26px;
            padding: 13px;
            border: 1.5px solid #fee2e2;
            border-radius: 12px;
            background: #fff7f7;
            color: #dc2626;
            cursor: pointer;
            font-weight: 700;
            font-size: 15.5px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: .18s ease;
        }

        .signout-button:hover {
            background: #dc2626;
            border-color: #dc2626;
            color: #fff;
            transform: translateY(-1px);
            box-shadow: 0 10px 22px rgba(220, 38, 38, .22);
        }

        @media (max-width: 800px) {
            .profile-layout {
                grid-template-columns: 1fr;
            }

            .topbar {
                padding: 0 20px;
            }

            .container {
                margin-top: 25px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <!-- TOP BAR -->
    <header class="topbar">

        <div
                class="brand"
                onclick="window.location.href='/patient/dashboard'"
        >
            <div class="brand-icon">
                <i class="bi bi-heart-pulse-fill"></i>
            </div>

            <div>
                <h2>MediConnect</h2>
                <p>Patient Portal</p>
            </div>
        </div>

        <button
                class="back-button"
                onclick="window.location.href='/patient/dashboard'"
        >
            <i class="bi bi-arrow-left"></i>
            Dashboard
        </button>

    </header>


    <!-- MAIN CONTENT -->
    <main class="container">

        <div class="page-heading">
            <h1>My Profile</h1>
            <p>View your MediConnect account information.</p>
        </div>


        <div class="profile-layout">

            <!-- PROFILE SUMMARY -->
            <section class="card profile-summary">

                <div
                        class="large-avatar"
                        id="profileAvatar"
                >
                    P
                </div>

                <h2 id="profileName">
                    Patient
                </h2>

                <p
                        class="email"
                        id="profileEmail"
                >
                    -
                </p>

                <span class="role-badge">
                    <i class="bi bi-person-check"></i>
                    Patient
                </span>

                <button
                        class="signout-button"
                        id="profileLogoutButton"
                >
                    <i class="bi bi-box-arrow-right"></i>
                    Sign Out
                </button>

            </section>


            <!-- PERSONAL INFORMATION -->
            <section class="card information-card">

                <h2>Personal Information</h2>

                <p>
                    Your registered account details.
                </p>


                <!-- FULL NAME -->
                <div class="info-row">

                    <div class="info-icon">
                        <i class="bi bi-person"></i>
                    </div>

                    <div class="info-content">
                        <span>Full Name</span>
                        <strong id="infoFullName">-</strong>
                    </div>

                </div>


                <!-- EMAIL -->
                <div class="info-row">

                    <div class="info-icon">
                        <i class="bi bi-envelope"></i>
                    </div>

                    <div class="info-content">
                        <span>Email Address</span>
                        <strong id="infoEmail">-</strong>
                    </div>

                </div>


                <!-- PHONE -->
                <div class="info-row">

                    <div class="info-icon">
                        <i class="bi bi-telephone"></i>
                    </div>

                    <div class="info-content">
                        <span>Phone Number</span>
                        <strong id="infoPhone">-</strong>
                    </div>

                </div>


                <!-- USER ID -->
                <div class="info-row">

                    <div class="info-icon">
                        <i class="bi bi-person-badge"></i>
                    </div>

                    <div class="info-content">
                        <span>User ID</span>
                        <strong id="infoUserId">-</strong>
                    </div>

                </div>


                <!-- ROLE -->
                <div class="info-row">

                    <div class="info-icon">
                        <i class="bi bi-shield-check"></i>
                    </div>

                    <div class="info-content">
                        <span>Account Role</span>
                        <strong id="infoRole">PATIENT</strong>
                    </div>

                </div>

            </section>

        </div>

    </main>

</div>


<script src="/js/patient-profile.js"></script>

</body>
</html>
